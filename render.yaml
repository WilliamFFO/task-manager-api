# Render Blueprint: creates the API from the Dockerfile.
# Set DATABASE_URL (your Neon / Supabase connection string) and CORS_ORIGIN in the Render dashboard.
services:
  - type: web
    name: task-manager-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
