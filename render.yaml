# Render Blueprint: creates the API from the Dockerfile (free plan).
# Only DATABASE_URL has to be pasted by hand (the Neon / Supabase connection string).
# JWT_SECRET is generated by Render and never leaves it.
services:
  - type: web
    name: task-manager-api
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        sync: false
      # The dashboard published on GitHub Pages (add more origins separated by commas)
      - key: CORS_ORIGIN
        value: https://williamffo.github.io
